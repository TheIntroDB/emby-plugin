# Release Drafter configuration — https://github.com/release-drafter/release-drafter
#
# This repo builds Emby releases from 4-part plugin versions (1.2.0.0) in tags and
# in the Emby catalog metadata, so the tag/name templates render the semver parts
# and append the fourth component explicitly. (Jellyfin's own plugins use
# single-integer versions, which is why their global config is not used here.)
#
# The release body produced here is what publish.yaml copies into the plugin
# catalog when the draft is published, so it is the changelog users see in Emby.

tag-prefix: v
version-template: '$MAJOR.$MINOR.$PATCH'
name-template: 'Version $RESOLVED_VERSION.0'
tag-template: 'v$RESOLVED_VERSION.0'
category-template: '### $TITLE'

categories:
  - title: ':boom: Breaking changes'
    semver-increment: major
    when:
      conventional:
        breaking: true

  - title: ':tada: New features'
    semver-increment: minor
    when:
      conventional:
        type: feat

  - title: ':bug: Bug fixes'
    when:
      - conventional:
          type: fix
      - labels:
          - bug

  - title: ':zap: Performance and refactors'
    when:
      conventional:
        types:
          - perf
          - refactor

  - title: ':memo: Documentation'
    when:
      - conventional:
          type: docs
      - labels:
          - documentation

  - title: ':gear: Maintenance'
    when:
      conventional:
        types:
          - chore
          - build
          - ci
          - test
          - style
          - revert

  # Catch-all: an empty `when` collects the changes no category above matched.
  - title: ':package: Other changes'

  # A floor under every draft version: never below a minor.
  #
  # This repo carries work pushed straight to main, and Release Drafter reads merged pull
  # requests only, so it cannot tell a feature release from a fix-only one here — this
  # release's port of the refresh feature would draft v1.2.1.0, where the sibling
  # jellyfin plugin, whose same change arrived as a `feat:` pull request, drafts v1.3.0.0.
  # A release with no entries at all would otherwise take the patch default.
  #
  # Set `semver-increment: patch` to draft patch versions again, or retype the tag on the
  # draft before publishing. A breaking change still escalates past this to a major.
  - type: version-resolver
    semver-increment: minor

template: |
  ## What's New

  $CHANGES
