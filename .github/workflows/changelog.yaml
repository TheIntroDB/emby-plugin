name: '📝 Update Release Draft'

# Keeps a draft GitHub Release up to date with what is in main, using
# .github/release-drafter.yml. Publishing the draft (with its pre-filled tag) is
# what triggers publish.yaml, which builds the plugin and uploads the assets.
#
# This replaces the jellyfin/jellyfin-meta-plugins changelog workflow, which
# assumes Jellyfin's single-integer versioning (tag v2 -> version 2.0.0.0) and
# cannot work with this repo's 4-part versions (tag v1.3.0.0).

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # The commits of the unreleased range are read from history.
          fetch-depth: 0

      - name: Update Draft
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Release Drafter only lists merged pull requests, so work pushed straight to main
      # leaves the draft reading "No changes". When that is the case, the commits since the
      # last published release are listed instead. The version comes from
      # .github/release-drafter.yml (its minor-version floor, see the comment there).
      - name: List the commits a pull-request-only draft cannot see
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A release PATCH that omits tag_name clears the tag GitHub shows for a draft
          # (it becomes `untagged-...`), so the tag Release Drafter just set is sent back.
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)][0]')
          draft_id=$(printf '%s' "$draft" | jq -r '.id // empty')
          if [ -z "$draft_id" ]; then
            echo "No draft release to fill in."
            exit 0
          fi

          draft_tag=$(printf '%s' "$draft" | jq -r '.tag_name // empty')
          body=$(printf '%s' "$draft" | jq -r '.body // ""')
          if ! printf '%s' "$body" | grep -q "No changes"; then
            echo "The draft already lists pull requests; leaving it alone."
            exit 0
          fi

          last_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name // empty' 2>/dev/null || true)
          range="HEAD"
          if [ -n "$last_tag" ]; then
            range="$last_tag..HEAD"
          fi

          commits=$(git log --no-merges --reverse \
            --pretty="* %s ([%h](https://github.com/$GITHUB_REPOSITORY/commit/%h))" "$range")
          if [ -z "$commits" ]; then
            echo "No commits since ${last_tag:-the beginning of history}."
            exit 0
          fi

          newbody=$(printf "## What's New\n\n### Commits\n\n%s\n" "$commits")

          args=(-f "body=$newbody")
          if [ -n "$draft_tag" ]; then
            args+=(-f "tag_name=$draft_tag")
          fi

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" "${args[@]}" > /dev/null

          echo "Draft ${draft_tag:-untagged} filled with $(printf '%s\n' "$commits" | wc -l) commits since ${last_tag:-the beginning of history}."
